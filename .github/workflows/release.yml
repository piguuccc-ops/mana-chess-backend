# A version tag (git tag v1.0.0 && git push --tags) also makes a GitHub release with a ready-to-run
# zip for running without Docker: backend.mjs + Start.bat (Windows) + start.sh + README.txt.
name: Release files

on:
  push:
    tags: ['v*']

permissions:
  contents: write              # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package
        run: |
          mkdir -p out/mana-chess-backend
          cp dist/backend.mjs release/Start.bat release/start.sh release/README.txt out/mana-chess-backend/
          cp LICENSE out/mana-chess-backend/LICENSE.txt
          chmod +x out/mana-chess-backend/start.sh
          (cd out && zip -r "../mana-chess-backend-${GITHUB_REF_NAME}.zip" mana-chess-backend)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "mana-chess-backend-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
