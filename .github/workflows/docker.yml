# ─────────────────────────────────────────────────────────────────────────────
# Builds the Docker image (amd64 + arm64) and pushes it to the GitHub Container Registry –
# ghcr.io/<owner>/mana-chess-backend – and, if the repository has the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN, to Docker Hub as well: <user>/mana-chess-backend.
#   push to main      → :latest and :sha-<commit>
#   tag v1.2.3        → :1.2.3 and :1.2
#   every Monday      → rebuilt, so security fixes of the base image arrive by themselves
# ─────────────────────────────────────────────────────────────────────────────
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mana-chess-backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests
        run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write          # push to ghcr.io with the workflow's own token
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo 'list<<EOF'
            echo "ghcr.io/${owner}/${IMAGE_NAME}"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then echo "docker.io/${DOCKERHUB_USERNAME,,}/${IMAGE_NAME}"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
